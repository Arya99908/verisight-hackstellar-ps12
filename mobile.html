<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#080d14"><title>VeriSight Evidence Intake</title><style>*{box-sizing:border-box}body{margin:0;background:#080d14;color:#e7f0f5;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(440px,100%);background:#101923;border:1px solid #1d2b38;border-radius:14px;padding:24px}.logo{color:#53d8e8;letter-spacing:.13em;font-weight:800;font-size:13px}h1{font-size:24px;margin:22px 0 8px}p{color:#91a7b6;font-size:13px}.drop{margin-top:24px;border:1px dashed #315161;border-radius:9px;padding:21px;text-align:center;background:#0b141c}input{display:block;width:100%;margin:14px 0;color:#a9bdc9}button{width:100%;background:#0b3b43;border:1px solid #238796;border-radius:7px;padding:12px;color:#c9fbff;font-size:14px}#msg{min-height:25px;color:#58d6a0;font-size:12px;margin-top:12px}.note{border-top:1px solid #1d2b38;margin-top:20px;padding-top:15px;font-size:11px}</style><body><div class="card"><div class="logo">VERISIGHT / PS-12</div><h1>Send evidence to workbench</h1><p>Select a screenshot from your phone. It will be transferred over your local network to the open VeriSight workbench.</p><form id="form"><div class="drop"><label>Choose screenshot<input name="evidence" type="file" accept="image/*" capture="environment" required></label></div><button>Send to workbench</button><div id="msg"></div></form><div class="note">Only use consented demo material. The file is saved in the local project’s ignored <code>uploads/</code> folder and is not sent to a cloud service.</div></div><script>document.querySelector('#form').onsubmit=async e=>{e.preventDefault();const m=document.querySelector('#msg'),d=new FormData(e.target);m.textContent='Sending…';try{const r=await fetch('/api/upload',{method:'POST',body:d});const j=await r.json();if(!r.ok)throw Error(j.error||'Upload failed');m.textContent='Evidence received. Return to the workbench; it will load shortly.';e.target.reset()}catch(err){m.textContent=err.message}}</script></body></html>
