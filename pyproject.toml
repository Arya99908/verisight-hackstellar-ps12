[project]
name = "verisight"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110.0", "uvicorn[standard]>=0.28.0", "python-multipart>=0.0.9",
  "pydantic>=2.6.0", "aiofiles>=23.2.1", "httpx>=0.27.0",
  "opencv-python-headless>=4.9.0.80", "numpy>=1.26.0",
"Pillow>=10.2.0",
  "exifread>=3.0.0", "qrcode[pil]>=7.4.2"
]

[tool.vercel]
entrypoint = "backend.app.main:app"

[tool.vercel.fastapi.static]
# CORS middleware otherwise keeps StaticFiles requests on the Python function.
cdn = true

[tool.vercel.scripts]
build = "npm run build --prefix frontend"



