<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/verisight-logo.jpeg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070b14" />
    <style>
      html, body, #root { width: 100%; min-width: 320px; height: 100%; min-height: 100%; margin: 0; background: #070b14; color: #f1f5f9; }
      .boot-fallback { box-sizing: border-box; min-height: 100vh; display: grid; place-items: center; padding: 24px; font: 14px/1.5 system-ui, sans-serif; }
      .boot-card { max-width: 480px; padding: 28px; border: 1px solid #1e293b; border-radius: 16px; background: #0b1120; }
      .boot-card h1 { margin: 0 0 8px; font-size: 18px; }
      .boot-card p { margin: 0; color: #94a3b8; }
      .boot-card button { margin-top: 18px; padding: 9px 14px; border: 0; border-radius: 8px; background: #0284c7; color: white; cursor: pointer; font: inherit; }
      #boot-error { display: none; }
    </style>
    <title>VeriSight — Intelligent Digital Evidence Forensics & Response Platform</title>
    <meta name="description" content="VeriSight: Inspect payment screenshots, review image cues, and draft incident reports. Screenshot analysis does not confirm payment settlement or legal admissibility." />
    <meta property="og:title" content="VeriSight — Intelligent Digital Evidence Forensics & Response Platform" />
    <meta property="og:description" content="Review payment screenshot cues and draft incident reports. Analysis does not confirm payment settlement or legal admissibility." />
  </head>
  <body class="bg-[#070b14] text-[#f1f5f9] antialiased overflow-hidden select-none font-sans">
    <div id="root">
      <main id="boot-fallback" class="boot-fallback" role="status" aria-live="polite">
        <section class="boot-card">
          <h1>Starting VeriSight…</h1>
          <p id="boot-message">Loading the forensic workbench.</p>
          <div id="boot-error">
            <p>The app files have not finished loading. Keep this tab open briefly, or reload if it remains here.</p>
            <button type="button" onclick="window.location.reload()">Reload VeriSight</button>
          </div>
        </section>
      </main>
    </div>
    <script>
      function showBootIssue(title, detail) {
        var fallback = document.getElementById('boot-fallback');
        if (!fallback) return;
        var heading = fallback.querySelector('h1');
        var message = document.getElementById('boot-message');
        var error = document.getElementById('boot-error');
        var detailText = error && error.querySelector('p');
        if (heading) heading.textContent = title;
        if (message) message.hidden = true;
        if (error) error.style.display = 'block';
        if (detailText) detailText.textContent = detail;
      }

      window.addEventListener('error', function (event) {
        if (event.target instanceof HTMLScriptElement) {
          showBootIssue('VeriSight app file failed to load', 'The main app script could not be downloaded. Check access to this site, then reload VeriSight.');
        } else if (event instanceof ErrorEvent) {
          showBootIssue('VeriSight could not initialize', 'An app startup error occurred before the workbench loaded. Reload VeriSight to try again.');
        }
      }, true);

      window.setTimeout(function () {
        showBootIssue('VeriSight is still loading', 'The app script has not finished loading yet. Keep this tab open briefly, or reload if it remains here.');
      }, 30000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
